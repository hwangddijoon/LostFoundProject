spring.application.name=lostfound
app.version=v6
server.port=8000

# DB 연결 (compose.yaml의 환경 변수)
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:lostfound}
spring.datasource.username=${DB_USER:lostfound}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.maximum-pool-size=5

# JSON 이름을 receipt_no 같은 snake_case로 (화면 app.js가 쓰는 이름)
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.time-zone=Asia/Seoul

# index.html은 캐시하지 않음 (새 버전을 바로 보이게)
spring.web.resources.cache.cachecontrol.no-store=true

# 오류 응답에 예외 내용을 넣지 않음
server.error.include-message=never
server.error.include-stacktrace=never

# R11 인증 메일 (SMTP). MAIL_HOST가 비어 있으면 메일 대신 로그에 인증번호를 찍는다 (Mailer.java)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
